<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
  <style>

    p {
      margin-top: 15px;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .text {
      color: grey;
      margin-left: 10px;
    }

    .bar {
      height: 50px;
      width: 600px;
      border-width: 2px;
      font-size: 20px;
      margin-left: 10px;
      padding-left: 50px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.15);
      border: solid;
      border-radius: 10px;
      border-color: rgb(113, 113, 113);
    }
  </style>
</head>
<body>

  <p class="text">
    Email
  </p>

  <input class="bar" type="text">

  <p class="text">
    By clicking Agree & Join, you agree to the Privacy Policy.
  </p>
</body>
</html>
