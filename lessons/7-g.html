<!DOCTYPE html>

<html lang="en">
<head>
  <title>Document</title>
  <style>
    .photo {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 150px;
      vertical-align: middle;
      cursor: pointer;
      transition: 0.15s;
      margin-top: 10px;
    }

    .photo:hover {
      opacity: 0.7;
    }

    .text {
      vertical-align: middle;
      width: 450px;
      height: 50px;
      margin-top: 10px;
      margin-left: 10px;
      font-size: 20px;
      padding-left: 10px;
      border: none;      
    }

    .text:hover {
      opacity: 0.7;
    }
    
    .tweet {
      vertical-align: middle;
      margin-top: 10px;
      margin-left: 10px;
      font-size: 20px;
      background-color: rgb(88, 184, 235);
      color: white;
      font-weight: bold;
      border-radius: 30px;
      border: none;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 20px;
      padding-right: 20px;
      box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: 0.15s;
      opacity: 0.9;

    }

    .tweet:hover {
      background-color: rgb(32, 154, 220);
      opacity: 1;
      box-shadow: 0px 3px 10px rgba(235, 218, 24, 0.15)
    }
  </style>
</head>
<body>
  <img class="photo" src="7-c-photo.jpg" alt="">

  <input class="text" type="text" name="" id="" placeholder="What's happening?">

  <button class="tweet">

    Tweet

  </button>
</body>
</html>
